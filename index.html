  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f11;
      --text: #f0f0f4;
      --line: #4c4c50;
      --blue: #3551f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Noto Sans Myanmar", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;

    }
    .brand {
      margin: 0;
      display: flex; align-items: center; gap: 10px;

    }
    .brand img { width: 28px; height: 28px; }
    .character-art {
      position: relative;
      width: 100%; max-width: 760px;

    .download-group p { margin: 0 0 20px; color: #a6a6ad; font-size: 12px; line-height: 1.5; }

      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text); text-decoration: none; font-size: 13px;
      min-height: 40px; padding: 9px 12px; border-radius: 6px;
      border: 1px solid var(--line); transition: background .15s;
      white-space: nowrap;

    .btn.primary { border-color: var(--blue); background: #283dbe; width: 100%; }
    .btn.primary:hover { background: var(--blue); }
    @media (max-width: 600px) {

  <script src="ghost-frames.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById('myanmar-ghost');
      const context = canvas.getContext('2d');
      if (!context) return;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const frames = window.myanmarGhostFrames;
      if (!frames?.length) return;
      let paused = reducedMotion.matches;
      let frame = 0;
      let lastTime = 0;
      let phase = 0;
      let width = 0;
      let height = 0;

      function draw() {
        context.clearRect(0, 0, width, height);
        if (!width || !height) return;
        const rows = frames[Math.floor(phase / 0.031) % frames.length];
        const cell = width / 104;
        const line = height / 43;
        context.font = `${Math.min(cell * 1.18, line * 0.85)}px "Noto Sans Myanmar", sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        rows.forEach((segments, row) => {
          let column = 0;
          segments.forEach(([text, outline]) => {
            context.fillStyle = outline ? '#7289ff' : '#e8e9f3';
            for (const letter of text) {
              if (letter !== ' ') {
                context.fillText(letter, (column + 2.5) * cell, (row + 1.5) * line, cell * 1.15);
              }
              column++;
            }
          });
        });
      }

      function tick(time) {
        // Cap at 30 fps; elapsed time keeps the float consistent across displays.
        if (!lastTime || time - lastTime >= 1000 / 30) {
          phase += lastTime ? Math.min(time - lastTime, 100) / 1000 : 0;
          lastTime = time;
          draw();
        }
        frame = requestAnimationFrame(tick);
      }

      function syncMotion() {
        cancelAnimationFrame(frame);
        lastTime = 0;
        draw();
        if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
      }

      new ResizeObserver(() => {
        const bounds = canvas.getBoundingClientRect();
        width = bounds.width;
        height = bounds.height;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        draw();
      }).observe(canvas);
      reducedMotion.addEventListener('change', event => { paused = event.matches; syncMotion(); });
      document.addEventListener('visibilitychange', syncMotion);
      document.fonts.ready.then(draw);
      syncMotion();
    })();
  </script>
