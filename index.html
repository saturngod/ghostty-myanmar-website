<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostty Myanmar</title>
  <meta name="description" content="A fork of the Ghostty terminal with Myanmar (Burmese) Unicode support for macOS.">
  <meta name="theme-color" content="#0f0f11">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Myanmar:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f11;
      --text: #f0f0f4;
      --muted: #828286;
      --line: #4c4c50;
      --blue: #3551f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Noto Sans Myanmar", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      gap: 28px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; font-weight: 600;
    }
    .brand img { width: 28px; height: 28px; }
    .shot {
      width: 100%; max-width: 760px; height: auto; display: block;
      border-radius: 10px;
      box-shadow: 0 0 0 1px #2a2a2e;
    }
    p { margin: 0; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 640px; }
    .my { font-family: "Noto Sans Myanmar", sans-serif; }
    .buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn {
      color: var(--text); text-decoration: none; font-size: 16px;
      padding: 10px 34px; border-radius: 6px; border: 1px solid var(--line);
      transition: background .15s;
    }
    .btn:hover { background: rgba(255,255,255,.05); }
    .btn.primary { border-color: var(--blue); }
    .btn.primary:hover { background: rgba(53,81,243,.12); }
    .meta { font-size: 12px; }
    .meta a { color: var(--muted); }
    @media (max-width: 480px) {
      .btn { flex: 1; text-align: center; padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <div class="brand"><img src="logo.png" alt="" width="28" height="28"> Ghostty <span class="my">မြန်မာ</span></div>

  <img class="shot" src="screenshot.png" width="1032" height="602" alt="Ghostty terminal window showing Myanmar text in commands, output, and file names.">

  <p>A fork of Ghostty that renders Myanmar (Burmese) Unicode text correctly, with stacked consonants, vowel signs, and medials.<br><span class="my">မြန်မာစာကို မှန်မှန်ကန်ကန် ပြသပေးသော Terminal</span></p>

  <div class="buttons">
    <a class="btn primary" href="Ghostty.dmg" download>Download</a>
    <a class="btn" href="https://github.com/saturngod/ghostty">GitHub</a>
  </div>

  <p class="meta">macOS 13+ · Apple silicon &amp; Intel · 37 MB · Based on <a href="https://ghostty.org">Ghostty</a></p>
</body>
</html>
