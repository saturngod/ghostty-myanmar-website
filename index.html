  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f11;
      --text: #f0f0f4;
      --line: #4c4c50;
      --blue: #3551f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Noto Sans Myanmar", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      gap: 28px;
    }
    .brand {
      margin: 0;
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; font-weight: 600;
    }
    .brand img { width: 28px; height: 28px; }
    .shot {
      width: 100%; max-width: 760px; height: auto; display: block;
      border-radius: 10px;
      box-shadow: 0 0 0 1px #2a2a2e;
    }
    .my { font-family: "Noto Sans Myanmar", sans-serif; }
    .buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn {
      color: var(--text); text-decoration: none; font-size: 16px;
      padding: 10px 34px; border-radius: 6px; border: 1px solid var(--line);
      transition: background .15s;
    }
    .btn:hover { background: rgba(255,255,255,.05); }
    .btn.primary { border-color: var(--blue); }
    .btn.primary:hover { background: rgba(53,81,243,.12); }
    @media (max-width: 480px) {
      .btn { flex: 1; text-align: center; padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <h1 class="brand"><img src="logo.png" alt="" width="28" height="28"> Ghostty <span class="my" lang="my">မြန်မာ</span></h1>

  <img class="shot" src="screenshot.png" width="1032" height="602" alt="Ghostty terminal window showing Myanmar text in commands, output, and file names.">

  <div class="buttons">
    <a class="btn primary" href="Ghostty.dmg" download>Download</a>
    <a class="btn" href="https://github.com/saturngod/ghostty">GitHub</a>
  </div>
</body>
